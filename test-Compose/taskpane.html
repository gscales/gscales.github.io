<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Recipients</title>

  <!-- Office.js — must be loaded from the CDN, not bundled -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    /* ── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens — Outlook-native palette ─────────────────────── */
    :root {
      --color-bg:           #f3f2f1;
      --color-surface:      #ffffff;
      --color-border:       #edebe9;
      --color-accent:       #0078d4;
      --color-accent-hover: #106ebe;
      --color-accent-light: #deecf9;
      --color-text:         #201f1e;
      --color-text-sub:     #605e5c;
      --color-text-dim:     #a19f9d;
      --color-success:      #107c10;
      --color-error:        #a4262c;
      --color-warning:      #c19c00;
      --radius-sm:          4px;
      --radius-md:          6px;
      --shadow-card:        0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
      --font:               'Segoe UI', system-ui, sans-serif;
      --transition:         150ms ease;
    }

    body {
      font-family: var(--font);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100vh;
      padding: 12px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header-icon {
      width: 28px; height: 28px;
      background: var(--color-accent);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { fill: #fff; width: 16px; height: 16px; }
    .header-title   { font-size: 15px; font-weight: 600; color: var(--color-text); }
    .header-sub     { font-size: 11px; color: var(--color-text-sub); margin-top: 1px; }

    /* ── Search / filter ────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .search-wrap svg {
      position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      fill: var(--color-text-dim);
      pointer-events: none;
    }
    #search {
      width: 100%;
      padding: 7px 8px 7px 28px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 12px;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    #search:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px rgba(0,120,212,.15);
    }

    /* ── Group label ────────────────────────────────────────────────── */
    .group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--color-text-dim);
      padding: 6px 0 4px;
    }

    /* ── Recipient cards ────────────────────────────────────────────── */
    .recipient-list { display: flex; flex-direction: column; gap: 4px; }

    .recipient-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition),
                  box-shadow var(--transition);
    }
    .recipient-card:hover {
      background: var(--color-accent-light);
      border-color: var(--color-accent);
    }
    .recipient-card:active { opacity: .85; }
    .recipient-card.adding { opacity: .6; pointer-events: none; }
    .recipient-card.added  { border-color: var(--color-success); }

    /* Avatar */
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #fff;
      flex-shrink: 0;
      user-select: none;
    }

    /* Text */
    .recipient-info { flex: 1; min-width: 0; }
    .recipient-name {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .recipient-address {
      font-size: 11px; color: var(--color-text-sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .recipient-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .tag-smtp { background:#dff6dd; color:#107c10; }
    .tag-ex   { background:#deecf9; color:#106ebe; }
    .tag-notes{ background:#fff4ce; color:#7d5a00; }

    /* Add icon */
    .add-icon {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--color-accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition);
    }
    .recipient-card:hover .add-icon { background: var(--color-accent-hover); }
    .add-icon svg { fill: #fff; width: 12px; height: 12px; }
    .add-icon.done { background: var(--color-success); }
    .add-icon.done svg { display: none; }
    .add-icon.done::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }

    /* ── Status banner ──────────────────────────────────────────────── */
    #status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    #status.show { display: flex; }
    #status.success { background: #dff6dd; color: var(--color-success); }
    #status.error   { background: #fde7e9; color: var(--color-error);   }

    /* ── Custom input row ───────────────────────────────────────────── */
    .custom-section { margin-top: 14px; }
    .custom-section .group-label { margin-bottom: 6px; }
    .custom-row { display: flex; gap: 6px; }
    .custom-row input {
      flex: 1;
      padding: 7px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font: inherit; font-size: 12px;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .custom-row input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px rgba(0,120,212,.15);
    }
    .btn-add-custom {
      padding: 7px 12px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition);
    }
    .btn-add-custom:hover    { background: var(--color-accent-hover); }
    .btn-add-custom:disabled { background: var(--color-text-dim); cursor: not-allowed; }

    /* ── Empty state ────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 20px 0;
      color: var(--color-text-dim);
      font-size: 12px;
      display: none;
    }
    .empty.show { display: block; }

    /* ── Scrollable list ────────────────────────────────────────────── */
    .list-scroll {
      max-height: 340px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .list-scroll::-webkit-scrollbar { width: 4px; }
    .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .list-scroll::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 16 16"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zm-5 6a5 5 0 0110 0H3z"/></svg>
    </div>
    <div>
      <div class="header-title">Quick Recipients</div>
      <div class="header-sub">Click a contact to add to To</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <svg viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 10-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 001.415-1.414l-3.85-3.85a1.007 1.007 0 00-.115-.099zm-5.242 1.156a5.5 5.5 0 110-11 5.5 5.5 0 010 11z"/></svg>
    <input type="text" id="search" placeholder="Search contacts…" autocomplete="off"/>
  </div>

  <!-- Pre-configured contact list -->
  <div class="group-label">Contacts</div>
  <div class="list-scroll">
    <div class="recipient-list" id="recipientList"></div>
    <div class="empty" id="emptyState">No contacts match your search.</div>
  </div>

  <!-- Status -->
  <div id="status"></div>

  <!-- Custom address entry -->
  <div class="custom-section">
    <div class="group-label">Add custom address</div>
    <div class="custom-row">
      <input type="email" id="customAddress" placeholder="name@example.com"/>
      <button class="btn-add-custom" id="btnAddCustom">Add</button>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
